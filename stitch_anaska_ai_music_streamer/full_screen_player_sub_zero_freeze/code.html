<script>
  // Simple interactive micro-state toggle for Like and Play buttons
  (function() {
    const likeBtn = document.getElementById('likeBtn');
    if (likeBtn) {
      likeBtn.addEventListener('click', () => {
        const icon = likeBtn.querySelector('.material-symbols-outlined');
        const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
        if (isFilled) {
          icon.style.fontVariationSettings = "'FILL' 0";
          likeBtn.classList.remove('text-[#00F2FE]', 'shadow-[0_0_18px_rgba(0,242,254,0.5)]', 'border-[#00F2FE]/40');
          likeBtn.classList.add('text-[#94A3B8]', 'border-[#38BDF8]/20');
        } else {
          icon.style.fontVariationSettings = "'FILL' 1";
          likeBtn.classList.remove('text-[#94A3B8]', 'border-[#38BDF8]/20');
          likeBtn.classList.add('text-[#00F2FE]', 'shadow-[0_0_18px_rgba(0,242,254,0.5)]', 'border-[#00F2FE]/40');
        }
      });
    }

    const masterPlayBtn = document.getElementById('masterPlayBtn');
    if (masterPlayBtn) {
      masterPlayBtn.addEventListener('click', () => {
        const icon = masterPlayBtn.querySelector('.material-symbols-outlined');
        if (icon.textContent === 'pause') {
          icon.textContent = 'play_arrow';
        } else {
          icon.textContent = 'pause';
        }
      });
    }
  })();
</script></main></body></html>
