<script>
  (() => {
    const pwdInput = document.getElementById('password');
    const pwdToggle = document.getElementById('toggle-pwd');
    const pwdIcon = document.getElementById('pwd-icon');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const linkSignup = document.getElementById('link-signup');
    const submitBtn = document.getElementById('submit-btn');

    pwdToggle?.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    const setTab = (isLogin) => {
      if (isLogin) {
        tabLogin.className = "flex-1 py-2.5 rounded-full font-label-md text-label-md text-slate-950 font-bold bg-gradient-to-r from-[#00F2FE] via-[#38BDF8] to-cyan-300 transition-all duration-300 shadow-[0_0_18px_rgba(0,242,254,0.45)] flex items-center justify-center gap-1.5";
        tabSignup.className = "flex-1 py-2.5 rounded-full font-label-md text-label-md text-cyan-200/60 hover:text-cyan-100 transition-all duration-300 flex items-center justify-center gap-1.5";
        submitBtn.querySelector('span span').textContent = "Enter the Stream";
      } else {
        tabSignup.className = "flex-1 py-2.5 rounded-full font-label-md text-label-md text-slate-950 font-bold bg-gradient-to-r from-[#00F2FE] via-[#38BDF8] to-cyan-300 transition-all duration-300 shadow-[0_0_18px_rgba(0,242,254,0.45)] flex items-center justify-center gap-1.5";
        tabLogin.className = "flex-1 py-2.5 rounded-full font-label-md text-label-md text-cyan-200/60 hover:text-cyan-100 transition-all duration-300 flex items-center justify-center gap-1.5";
        submitBtn.querySelector('span span').textContent = "Initiate Neural Link";
      }
    };

    tabLogin?.addEventListener('click', () => setTab(true));
    tabSignup?.addEventListener('click', () => setTab(false));
    linkSignup?.addEventListener('click', (e) => {
      e.preventDefault();
      setTab(false);
    });
  })();
